org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
org.gradle.workers.max=1
# This build VM's network stack resets IPv4-mapped IPv6 connections, and
# Java defaults to IPv6 dual-stack sockets — so the Gradle daemon (which
# talks over 127.0.0.1) could never connect ("Could not dispatch a message
# to the daemon" / "Connection reset by peer"). Forcing pure IPv4 fixes it.
# The flag must also be on the client JVM: pass it via GRADLE_OPTS when
# running Gradle, e.g. GRADLE_OPTS="-Djava.net.preferIPv4Stack=true".
# Same reason for the Kotlin setting below: the Kotlin daemon would hit
# the same socket problem, so compile in-process instead.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The egress MITM proxy / CDN can be slow to answer dependency downloads;
# give them 2 minutes instead of the 30s default before failing.
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.http.connectionTimeout=60000
# Chaquopy's Python 3.13 is 64-bit only (arm64-v8a, x86_64). Flutter's Gradle
# plugin would otherwise clear ndk.abiFilters and force all three ABIs
# (including 32-bit armeabi-v7a), which Chaquopy rejects at configuration
# time. Setting this makes Flutter respect the abiFilters in
# app/build.gradle.kts (arm64-v8a + x86_64).
disable-abi-filtering=true
